services:
  # Servicio 1: Nuestra Web
  app:
    build: ./app
    container_name: contenedor-web
    ports:
      - "8080:5000"

  # Servicio 2: Prometheus (Vigilante)
  prometheus:
    image: prom/prometheus:latest
    container_name: contenedor-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  # Servicio 3: Grafana (Dashboard visual)
  grafana:
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    image: grafana/grafana:latest
    container_name: contenedor-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data: